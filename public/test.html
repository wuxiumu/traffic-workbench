<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>m.js 嵌入测试页</title>
  <!-- 统计脚本接入示例（与站点管理生成的代码一致） -->
  <script async src="/m.js" data-key="demo0001"></script>
  <style>
    body { font-family: sans-serif; padding: 40px; background: #f5f5f5; }
    button { margin-right: 12px; padding: 10px 18px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>m.js 嵌入测试页</h1>
  <p>模拟被统计网站：加载即上报 PV，点击按钮模拟 SPA 路由切换。</p>
  <button onclick="history.pushState(null,'','/spa-page-a')">跳到 /spa-page-a</button>
  <button onclick="history.pushState(null,'','/spa-page-b')">跳到 /spa-page-b</button>
  <button onclick="location.hash='#section-1'">改 hash #section-1</button>
  <button onclick="history.back()">后退</button>
</body>
</html>
