<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>u.js 万能统计测试页</title>
  <!-- 万能统计接入示例：免 key，任意网站粘贴即可 -->
  <script async src="/u.js"></script>
  <style>
    body { font-family: sans-serif; padding: 40px; background: #f5f5f5; }
    button { margin-right: 12px; padding: 10px 18px; cursor: pointer; }
    code { background: #e8e8e8; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>u.js 万能统计测试页</h1>
  <p>3 秒规则自测：本页停留满 <code>3 秒</code>后计入 PV/IP；点下面按钮 <b>快速连续跳转</b>（间隔小于 3 秒）的路径不会计入。</p>
  <button onclick="history.pushState(null,'','/u-spa-fast-a')">快跳 A（1秒后再跳，不计）</button>
  <button onclick="history.pushState(null,'','/u-spa-stay')">跳到Stay页（停3秒以上，计入）</button>
  <script>
    // 演示：跳到 A 后 1 秒自动跳走 —— 该路径不应被统计
    function jumpA() {
      history.pushState(null, '', '/u-spa-fast-a');
      setTimeout(() => history.pushState(null, '', '/u-spa-fast-b'), 1000);
    }
    document.querySelectorAll('button')[0].onclick = jumpA;
  </script>
</body>
</html>
